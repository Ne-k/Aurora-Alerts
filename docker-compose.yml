services:
  aurora_bot:
    build: .
    container_name: aurora-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DISCORD_WEBHOOK: "${DISCORD_WEBHOOK:-}"
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:-}"
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID:-}"
      # Core bot defaults; override via .env for production tuning
      KP_THRESHOLD: "${KP_THRESHOLD:-6.5}"
      LATITUDE: "${LATITUDE:-45.5152}"
      LONGITUDE: "${LONGITUDE:--122.6784}"
      LOCATION_NAME: "${LOCATION_NAME:-Portland, OR}"
      TIMEZONE_NAME: "${TIMEZONE_NAME:-America/Los_Angeles}"
      UPDATE_INTERVAL_HOURS: "${UPDATE_INTERVAL_HOURS:-2}"
      ALERT_DELETE_AFTER_MINUTES: "${ALERT_DELETE_AFTER_MINUTES:-15}"
      HEALTH_REFRESH_MINUTES: "${HEALTH_REFRESH_MINUTES:-60}"
      UPDATE_RETRY_MINUTES: "${UPDATE_RETRY_MINUTES:-15}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      # Outbound HTTP limits
      HTTP_POOL_SIZE: "${HTTP_POOL_SIZE:-8}"
      HTTP_TIMEOUT_SECONDS: "${HTTP_TIMEOUT_SECONDS:-20}"
      # Optional external APIs
      GFZ_JSON_BASE_URL: "${GFZ_JSON_BASE_URL:-https://kp.gfz.de/app/json/}"
      OPENWEATHER_API_KEY: "${OPENWEATHER_API_KEY:-}"
      MAF_APP_USER_ID: "${MAF_APP_USER_ID:-}"
      TZ: "${TZ:-UTC}"
    volumes:
      - ./data:/app/data
    # Headroom over the pooled socket count, so a burst cannot wedge the process
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    # Keep log growth bounded on small hosts
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-m", "aurora.healthcheck"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 3m
